[package]
name = "ru5ty-gate-http"
description = "Axum errors, extractors and middleware shared by every service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
futures-util = "0.3.34"
http = "1.5.0"
ru5ty-gate-config = { version = "1.0.0", path = "../config" }
ru5ty-gate-logging = { version = "1.0.0", path = "../logging" }
ru5ty-gate-observability = { version = "1.0.0", path = "../observability" }
ru5ty-gate-types = { version = "1.0.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "catch-panic"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

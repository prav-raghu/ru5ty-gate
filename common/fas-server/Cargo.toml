[package]
name = "ru5ty-gate-fas-server"
description = "openNDS forwarding authentication service HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
hex = "0.4.3"
ru5ty-gate-central-client = { version = "1.0.0", path = "../central-client" }
ru5ty-gate-session-store = { version = "1.0.0", path = "../session-store" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "set-header", "timeout"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
validator = { version = "0.21.0", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[package]
name = "ru5ty-gate-fas-server"
description = "openNDS forwarding authentication service HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
ru5ty-gate-central-client = { version = "1.0.0", path = "../central-client" }
ru5ty-gate-session-store = { version = "1.0.0", path = "../session-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
urlencoding = "2.1.3"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

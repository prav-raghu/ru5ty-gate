[package]
name = "ru5ty-gate-storage"
description = "S3-compatible file storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-config = "1.12.0"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
chrono = "0.4.45"
mime_guess = "2.0.5"
ru5ty-gate-config = { version = "1.0.0", path = "../config" }
ru5ty-gate-types = { version = "1.0.0", path = "../types" }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

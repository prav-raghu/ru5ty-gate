[package]
name = "ru5ty-gate-queue"
description = "Redis-backed job queue and worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-insecure"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt", "time", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[package]
name = "ru5ty-gate-database"
description = "SQLx migrations, models, repositories, pool and seed data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bcrypt = "0.19.3"
chrono = "0.4.45"
ru5ty-gate-config = { version = "1.0.0", path = "../config" }
ru5ty-gate-types = { version = "1.0.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

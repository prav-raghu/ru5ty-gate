[package]
name = "ru5ty-gate-webhooks"
description = "Webhook delivery with retries and SSRF protection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
ru5ty-gate-database = { version = "1.0.0", path = "../database" }
ru5ty-gate-types = { version = "1.0.0", path = "../types" }
ru5ty-gate-utilities = { version = "1.0.0", path = "../utilities" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "chrono", "json", "derive"] }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt", "time", "net"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[lints]
workspace = true

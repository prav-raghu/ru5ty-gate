<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Welcome aboard</title>
    </head>
    <body style="margin: 0; padding: 0; background-color: #f5f6f8; font-family: Inter, system-ui, sans-serif">
        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" width="600" style="background: white; margin: 40px auto; border-radius: 8px; padding: 40px">
            <tr>
                <td>
                    <h1 style="margin: 0 0 16px; font-size: 22px">Welcome aboard</h1>
                    <p>Hello {{username}},</p>
                    <p>An admin account was created for you on {{dateLoggedIn}}. Verify your email to activate it.</p>
                    <p><a href="{{verificationLink}}">Verify email</a></p>
                    <p style="color: #6b7280; font-size: 12px">&copy; {{currentYear}}</p>
                </td>
            </tr>
        </table>
    </body>
</html>

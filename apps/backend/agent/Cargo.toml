[package]
name = "ru5ty-gate-agent"
description = "Captive portal agent daemon running behind openNDS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ru5ty_gate_agent"
path = "src/lib.rs"

[[bin]]
name = "ru5ty-gate-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive"] }
ru5ty-gate-agent-config = { version = "1.0.0", path = "../../../common/agent-config" }
ru5ty-gate-central-client = { version = "1.0.0", path = "../../../common/central-client" }
ru5ty-gate-fas-server = { version = "1.0.0", path = "../../../common/fas-server" }
ru5ty-gate-heartbeat = { version = "1.0.0", path = "../../../common/heartbeat" }
ru5ty-gate-logging = { version = "1.0.0", path = "../../../common/logging" }
ru5ty-gate-ndsctl = { version = "1.0.0", path = "../../../common/ndsctl" }
ru5ty-gate-session-store = { version = "1.0.0", path = "../../../common/session-store" }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
secrecy = "0.10.3"
serde_json = "1.0.151"

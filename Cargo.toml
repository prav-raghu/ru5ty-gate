[workspace]
resolver = "3"
members = ["common/*", "apps/backend/agent", "apps/backend/customer-api", "apps/backend/admin-api", "apps/backend/schedule-api", "apps/backend/api-gateway"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
unused_async = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

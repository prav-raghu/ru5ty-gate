name: Security Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read
    actions: read

jobs:
    dependency-audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run pnpm audit
              run: pnpm audit --audit-level=high

    codeql:
        name: CodeQL Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
              with:
                  languages: javascript-typescript
                  queries: security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
              with:
                  category: "/language:javascript-typescript"
                  upload: never
                  output: codeql-results

            - name: Upload SARIF results as artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: codeql-sarif
                  path: codeql-results
                  retention-days: 30

            - name: Fail on high severity findings
              run: |
                  COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' codeql-results/javascript.sarif)
                  echo "High severity findings: $COUNT"
                  if [ "$COUNT" -gt 0 ]; then
                    jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/javascript.sarif
                    exit 1
                  fi

    secrets-scan:
        name: Secrets Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: TruffleHog OSS Scan (PR diff)
              if: github.event_name == 'pull_request'
              uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}
                  extra_args: --only-verified

            - name: TruffleHog OSS Scan (full history)
              if: github.event_name != 'pull_request'
              uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
              with:
                  path: ./
                  extra_args: --only-verified

    rust-advisories:
        name: Rust Advisories
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Check RustSec advisories
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
              with:
                  command: check advisories

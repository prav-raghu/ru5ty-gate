name: Continuous Integration & Deploy

on:
    push:
        branches: [main, develop]
        tags:
            - "v*.*.*"
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: "22"
    PNPM_VERSION: "11.5.0"
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    REGISTRY: ghcr.io
    REGISTRY_NAMESPACE: ${{ github.repository_owner }}

jobs:
    install:
        name: Install Dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache Rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Check formatting
              run: pnpm format:check

            - name: Run ESLint and Clippy
              run: pnpm lint

            - name: Audit Rust dependencies
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache Rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Run TypeScript compiler and cargo check
              run: pnpm typecheck

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [install, typecheck]
        env:
            VITE_ADMIN_API_BASE_URL: "http://localhost:4001/api/v1"
            VITE_ADMIN_APP_NAME: "CI Build"
            NEXT_PUBLIC_CUSTOMER_API_BASE_URL: "http://localhost:4002/api/v1"
            NEXT_PUBLIC_CUSTOMER_APP_NAME: "CI Build"
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache Rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Build all packages
              run: pnpm build

            - name: Build Rust workspace
              run: cargo build --workspace --locked

            - name: Upload build artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist-artifacts
                  path: |
                      apps/**/dist
                  retention-days: 1

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: [install, build]
        env:
            DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
            TEST_REDIS_URL: "redis://localhost:6379"
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache Rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Run tests with coverage
              run: pnpm test:coverage

            - name: Run Rust tests
              run: pnpm test:rust

            - name: Upload coverage artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: coverage-reports
                  path: |
                      apps/frontend/*/coverage
                  retention-days: 1
                  if-no-files-found: ignore

    quality-gate:
        name: Quality Gate
        runs-on: ubuntu-latest
        needs: [lint, typecheck, build, test]
        if: always()
        steps:
            - name: Check all jobs passed
              run: |
                  if [[ "${{ needs.lint.result }}" != "success" ]] || \
                     [[ "${{ needs.typecheck.result }}" != "success" ]] || \
                     [[ "${{ needs.build.result }}" != "success" ]] || \
                     [[ "${{ needs.test.result }}" != "success" ]]; then
                    echo "::error::Quality gate failed - one or more checks did not pass"
                    exit 1
                  fi
                  echo "All quality checks passed"

    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        needs: [build, test]
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Download coverage artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: coverage-reports
                  path: .

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                  args: >
                      -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'ru5ty-gate' }}
                      -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'ru5ty-gate' }}

            - name: SonarQube Quality Gate check
              uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
              timeout-minutes: 5
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: https://sonarcloud.io
              continue-on-error: true

    changes:
        name: Detect changed services
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        outputs:
            common: ${{ steps.filter.outputs.common }}
            admin-api: ${{ steps.filter.outputs.admin-api }}
            api-gateway: ${{ steps.filter.outputs.api-gateway }}
            customer-api: ${{ steps.filter.outputs.customer-api }}
            schedule-api: ${{ steps.filter.outputs.schedule-api }}
            admin-web: ${{ steps.filter.outputs.admin-web }}
            customer-web: ${{ steps.filter.outputs.customer-web }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Filter changed paths
              id: filter
              uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
              with:
                  filters: |
                      shared: &shared
                        - 'common/**'
                        - 'Cargo.toml'
                        - 'Cargo.lock'
                        - 'pnpm-workspace.yaml'
                        - 'pnpm-lock.yaml'
                        - 'package.json'
                        - 'turbo.json'
                      common: *shared
                      admin-api:
                        - *shared
                        - 'apps/backend/admin-api/**'
                      api-gateway:
                        - *shared
                        - 'apps/backend/api-gateway/**'
                      customer-api:
                        - *shared
                        - 'apps/backend/customer-api/**'
                      schedule-api:
                        - *shared
                        - 'apps/backend/schedule-api/**'
                      admin-web:
                        - *shared
                        - 'apps/frontend/admin-web/**'
                      customer-web:
                        - *shared
                        - 'apps/frontend/customer-web/**'

    agent-openwrt:
        name: Build agent for OpenWrt (aarch64 musl)
        needs: quality-gate
        if: needs.quality-gate.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Install cross
              uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
              with:
                  tool: cross

            - name: Build static binary
              run: cross build --release --locked --target aarch64-unknown-linux-musl -p ru5ty-gate-agent

            - name: Smoke test under qemu
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends qemu-user-static
                  BIN=target/aarch64-unknown-linux-musl/release/ru5ty-gate-agent
                  file "$BIN"
                  ls -l "$BIN"
                  qemu-aarch64-static "$BIN" --version

            - name: Upload binary
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ru5ty-gate-agent-aarch64-musl
                  path: |
                      target/aarch64-unknown-linux-musl/release/ru5ty-gate-agent
                      apps/backend/agent/openwrt/
                      apps/backend/agent/config/agent.router.example.toml
                  retention-days: 30

    docker-build:
        name: Build & push (${{ matrix.service }})
        needs: [quality-gate, changes]
        if: needs.quality-gate.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            packages: write
        concurrency:
            group: docker-build-${{ matrix.service }}-${{ github.ref }}
            cancel-in-progress: false
        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: admin-api
                      dockerfile: apps/backend/admin-api/Dockerfile
                    - service: api-gateway
                      dockerfile: apps/backend/api-gateway/Dockerfile
                    - service: customer-api
                      dockerfile: apps/backend/customer-api/Dockerfile
                    - service: schedule-api
                      dockerfile: apps/backend/schedule-api/Dockerfile
                    - service: admin-web
                      dockerfile: apps/frontend/admin-web/Dockerfile
                    - service: customer-web
                      dockerfile: apps/frontend/customer-web/Dockerfile
        env:
            SHOULD_BUILD: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        steps:
            - name: Checkout
              if: env.SHOULD_BUILD == 'true'
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up Docker Buildx
              if: env.SHOULD_BUILD == 'true'
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Log in to GHCR
              if: env.SHOULD_BUILD == 'true'
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Short SHA
              if: env.SHOULD_BUILD == 'true'
              id: sha
              run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Release version
              if: env.SHOULD_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
              id: version
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Build & push ${{ matrix.service }}
              if: env.SHOULD_BUILD == 'true'
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  build-args: |
                      ${{ matrix.service == 'admin-web' && format('VITE_ADMIN_API_BASE_URL={0}', vars.VITE_ADMIN_API_BASE_URL) || '' }}
                      ${{ matrix.service == 'admin-web' && format('VITE_ADMIN_APP_NAME={0}', vars.VITE_ADMIN_APP_NAME) || '' }}
                      ${{ matrix.service == 'customer-web' && format('NEXT_PUBLIC_CUSTOMER_API_BASE_URL={0}', vars.CUSTOMER_WEB_API_BASE_URL) || '' }}
                      ${{ matrix.service == 'customer-web' && format('NEXT_PUBLIC_CUSTOMER_APP_NAME={0}', vars.CUSTOMER_WEB_APP_NAME) || '' }}
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:main
                      ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
                      ${{ steps.version.outputs.tag && format('{0}/{1}/{2}:{3}', env.REGISTRY, env.REGISTRY_NAMESPACE, matrix.service, steps.version.outputs.tag) || '' }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    deploy:
        name: Trigger Coolify deploy
        needs: docker-build
        runs-on: ubuntu-latest
        if: needs.docker-build.result == 'success'
        environment: production
        permissions: {}
        concurrency:
            group: docker-deploy-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Call Coolify deploy webhook
              run: |
                  curl --fail-with-body -X GET \
                    "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
                    -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

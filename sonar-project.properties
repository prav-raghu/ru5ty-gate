# SonarCloud/SonarQube Configuration
# For SonarCloud: https://sonarcloud.io
# For SonarQube: Your self-hosted instance

# Project identification
sonar.projectKey=ru5ty-gate

# Project metadata
sonar.projectName=Ru5ty Gate
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=apps/frontend,apps/mobile
sonar.tests=apps/frontend,apps/mobile

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/.next/**,\
  **/public/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/*.d.ts,\
  **/migrations/**,\
  **/target/**,\
  **/*.rs,\
  **/generated/**

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.config.*

# Test inclusions
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/tests/**/*.ts

# Coverage
sonar.javascript.lcov.reportPaths=\
  apps/frontend/*/coverage/lcov.info

# TypeScript configuration
sonar.typescript.tsconfigPaths=\
  apps/frontend/admin-web/tsconfig.json,\
  apps/frontend/customer-web/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gates - customize thresholds
sonar.qualitygate.wait=true

packages:
    - "apps/frontend/*"
    - "apps/mobile/*"
    # apps/cms is excluded — managed independently with npm

verifyDepsBeforeRun: false

allowBuilds:
    "@parcel/watcher": set this to true or false
    "@sentry/cli": true
    core-js: true
    cypress: true
    esbuild: true
    sharp: true
    unrs-resolver: true
